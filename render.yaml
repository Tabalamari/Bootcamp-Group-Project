services:
  - type: web
    name: skillbridge-staging
    runtime: docker
    plan: free
    region: frankfurt
    branch: feature/prepare-supabase-production
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DB_CLIENT
        value: postgres
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: DATABASE_SSL_CA
        sync: false
